# Reverse proxy ให้ทั้งระบบอยู่หลัง port เดียว (host 5052 -> คอนเทนเนอร์นี้ 80)
# เซิร์ฟเวอร์มหาลัยเปิดออกนอกได้พอร์ตเดียว แอปกับ API จึงต้อง same-origin
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # backend จำกัดหลักฐานที่ 10 MB แล้วตอบ 413 เป็นภาษาไทย
    # ตั้งตรงนี้ให้สูงกว่าเล็กน้อย เพื่อให้ข้อความของ backend ถึงผู้ใช้
    # ไม่ใช่หน้า 413 เปล่า ๆ ของ nginx
    client_max_body_size 12m;

    # /api/ -> backend:8000/ (trailing slash = ตัด /api ออก)
    # route ฝั่ง FastAPI อยู่ที่ root ทั้งหมด (/auth, /participations, ...) ไม่มี prefix /api
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR (easyocr) ใช้เวลาต่อไฟล์นานกว่า 60 วินาทีดีฟอลต์ได้
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # ไฟล์หลักฐาน/รายงานถูก stream ผ่าน backend — ปิด buffer ให้ส่งตรงถึงเบราว์เซอร์
        proxy_buffering off;
    }

    # bundle ของ Flutter ถูก cache แรงมาก ถ้า index/sw ค้าง ผู้ใช้จะเห็นเวอร์ชันเก่า
    # หลัง deploy ใหม่ ทั้งที่ไฟล์บนเซิร์ฟเวอร์เปลี่ยนแล้ว
    location = /index.html                 { add_header Cache-Control "no-store" always; }
    location = /flutter_service_worker.js  { add_header Cache-Control "no-store" always; }
    location = /version.json               { add_header Cache-Control "no-store" always; }

    # แอปใช้ hash routing (/#/checkin) — fallback ไว้กัน refresh ที่ path อื่นหลุด 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
