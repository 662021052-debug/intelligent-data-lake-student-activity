services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: activity_lake
    # ไม่ผูก host port — เข้าถึงได้เฉพาะใน docker network (backend ต่อที่ db:5432)
    # ถ้าต้อง psql จากเครื่อง ใช้ `docker compose exec db psql -U postgres -d activity_lake`
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      # S3 API (9000) ไม่เปิดออก host — backend เรียกภายในที่ minio:9000
      # และไม่มีที่ไหนคืน presigned URL ให้เบราว์เซอร์ (backend stream ไฟล์เอง)
      - "9052:9001"   # Web console เท่านั้น
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/activity_lake
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      # same-origin ผ่าน nginx อยู่แล้ว ตั้งไว้กันเหนียวเผื่อเรียกข้าม origin
      CORS_ORIGINS: ${CORS_ORIGINS:-http://miscis.scidi.tsu.ac.th:5052,http://localhost:5052}
      # ลิงก์ใน QR เช็กอินและอีเมล — ไม่ส่งตรงนี้ค่าใน .env จะไม่เข้าคอนเทนเนอร์
      # แล้วตกเป็นดีฟอลต์ http://localhost:8080 ใน config.py (ลิงก์เสียเงียบ ๆ)
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-http://miscis.scidi.tsu.ac.th:5052}
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_SECURE: "false"
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE:-bronze}
      # ---- Chatbot (LLM + RAG) — read from the project-root .env ----
      LLM_BACKEND: ${LLM_BACKEND:-stub}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-models/gemini-embedding-001}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-memory}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      # ---- Email (SMTP) — ค่าจริงอยู่ใน .env ที่ root ของโปรเจกต์ (ไม่ถูก commit) ----
      # image ไม่มีไฟล์ .env ถ้าไม่ส่งตรงนี้ ตัวส่งในคอนเทนเนอร์จะตกเป็น stub แบบเงียบ ๆ
      EMAIL_BACKEND: ${EMAIL_BACKEND:-stub}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      # .env เขียนได้ทั้ง SMTP_PASSWORD และ SMTP_PASS (config.py รับทั้งสองชื่อ)
      SMTP_PASSWORD: ${SMTP_PASSWORD:-${SMTP_PASS:-}}
      SMTP_FROM: ${SMTP_FROM:-no-reply@tsu.ac.th}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # ---- งานแจ้งเตือนตั้งเวลา — ไม่ส่งตรงนี้ ค่าใน .env จะไม่เข้าคอนเทนเนอร์ (เปิด scheduler จาก .env ไม่ได้) ----
      # scheduler ปิดเป็นค่าเริ่มต้น เปิดแล้วส่งอีเมลจริงถึงทุกนิสิตที่มีอีเมล
      NOTIFY_SCHEDULER_ENABLED: ${NOTIFY_SCHEDULER_ENABLED:-false}
      NOTIFY_REMINDER_ENABLED: ${NOTIFY_REMINDER_ENABLED:-true}
      NOTIFY_AT_RISK_ENABLED: ${NOTIFY_AT_RISK_ENABLED:-false}
      NOTIFY_AT_RISK_HOUR: ${NOTIFY_AT_RISK_HOUR:-8}
      NOTIFY_ACTIVITY_REMINDER_HOUR: ${NOTIFY_ACTIVITY_REMINDER_HOUR:-18}
      NOTIFY_AT_RISK_THRESHOLD: ${NOTIFY_AT_RISK_THRESHOLD:-50}
      NOTIFY_REGISTRATION_EMAIL_ENABLED: ${NOTIFY_REGISTRATION_EMAIL_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # ไม่ผูก host port — เข้าผ่าน nginx ที่ /api/ เท่านั้น
    expose:
      - "8000"
    # Run migrations first so a persisted volume never drifts from the models
    # (create_all only adds missing tables, it never alters existing ones).
    command: sh -c "alembic upgrade head && python seed.py && python seed_criteria.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ทางเข้าเดียวของระบบ: เสิร์ฟ Flutter web + proxy /api/ ไป backend
  # frontend build ที่เครื่อง (`flutter build web --dart-define=API_BASE_URL=/api`)
  # แล้ว bind-mount เข้ามา — ไม่ต้องมี Flutter บนเซิร์ฟเวอร์
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "5052:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db_data:
  minio_data:
